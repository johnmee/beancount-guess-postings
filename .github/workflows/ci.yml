name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The oldest versions the package claims to support, on the oldest Python.
  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11
      - run: uv pip install --resolution lowest-direct -e .
      - run: uv pip install pytest
      - run: .venv/bin/python -m pytest

  # The sdist and wheel build, and the installed wheel runs.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uv venv --python 3.13 /tmp/wheel-venv
      - run: uv pip install --python /tmp/wheel-venv dist/*.whl
      - run: /tmp/wheel-venv/bin/guess-postings --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
