[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beancount-guess-postings"
version = "0.1.0"
description = "Complete imported Beancount transactions by fuzzy-matching them against your past ones."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Mee" }]
keywords = ["beancount", "accounting", "import", "autocomplete", "fuzzy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "beancount>=3.2.3",
    "click>=8.1.8",
    "rapidfuzz>=3.9",
]

[project.urls]
Homepage = "https://github.com/johnmee/beancount-guess-postings"
Issues = "https://github.com/johnmee/beancount-guess-postings/issues"

[project.scripts]
guess-postings = "beancount_guess_postings.cli:fill_cli"
guess-postings-comment = "beancount_guess_postings.cli:comment_cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_guess_postings"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# On top of Ruff's defaults: import sorting, and bugbear's likely-bug checks.
extend-select = ["I", "B"]
